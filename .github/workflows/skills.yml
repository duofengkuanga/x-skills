name: Skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: npm install --ignore-scripts
      - run: npm test
      - run: pip install --requirement requirements-ci.txt
      - run: python scripts/codex-quick-validate.py skills/agent-party-time-repair-bug
      - run: python scripts/codex-quick-validate.py skills/agent-party-time-integrate-update-batch
